name: Deploy Suns Echo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  REVIEW_DIRECTORY: review/media-day-2026-09-28

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout edition
        uses: actions/checkout@v4

      - name: Checkout approved edition for review packaging
        if: github.ref != 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: main
          path: approved-edition

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify review edition
        if: github.ref != 'refs/heads/main'
        env:
          NEXT_PUBLIC_ECHO_BASE_PATH: /suns-echo/${{ env.REVIEW_DIRECTORY }}
        run: npm run review:check

      - name: Verify approved release
        if: github.ref == 'refs/heads/main'
        run: npm run release:check

      - name: Package review with approved root
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p "site/$REVIEW_DIRECTORY"
          cp -a out/. "site/$REVIEW_DIRECTORY/"
          npm ci --prefix approved-edition
          npm run build --prefix approved-edition
          cp -a approved-edition/out/. site/
          touch site/.nojekyll

      - name: Package release
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp -a out/. site/
          touch site/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
